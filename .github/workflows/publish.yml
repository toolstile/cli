# Publishes `toolstile` to npm with trusted publishing (OIDC).
# No npm token is stored in this repository; npm verifies this workflow instead.
# Release: bump "version" in package.json, commit, then push a matching tag (v1.2.3).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and branches, so the tag can be checked against main.
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi

      # No registry-url: npm 11.5.1+ (bundled with this Node) exchanges the
      # OIDC token itself, and a generated .npmrc would make every install step
      # warn about the unset NODE_AUTH_TOKEN placeholder.
      # Vite+ installs Node.js 24.17.0 and the pnpm in packageManager; version matches vite-plus in package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.5.1
          node-version: 24.17.0
          run-install: false

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: vp install --frozen-lockfile
      - run: vp run typecheck
      # The test script builds dist first, then runs the unit and CLI tests against it.
      - run: vp run test

      - name: Publish toolstile
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "toolstile@$version" version >/dev/null 2>&1; then
            echo "toolstile@$version is already published"
          else
            npm publish --access public --ignore-scripts
          fi
