# Publishes `toolstile` to npm with trusted publishing (OIDC).
# No npm token is stored in this repository; npm verifies this workflow instead.
# Release: bump "version" in package.json, commit, then push a matching tag (v1.2.3).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      - name: Publish toolstile
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "toolstile@$version" version >/dev/null 2>&1; then
            echo "toolstile@$version is already published"
          else
            npm publish --access public --ignore-scripts
          fi
