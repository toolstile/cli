# Runs the same gates as publish.yml on every pull request and on main.
# Read-only token, no secrets; publishing stays in publish.yml.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ installs Node.js 24.17.0 and the pnpm in packageManager; version matches vite-plus in package.json.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.5.1
          node-version: 24.17.0
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run typecheck
      # The test script builds dist first, then runs the unit and CLI tests against it.
      - run: vp run test
      - name: Check the published file list
        run: npm pack --dry-run
